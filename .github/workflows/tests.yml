name: Pruebas automatizadas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Se prueba en las versiones de Python recomendadas (ver README).
        # Python 3.9 deliberadamente NO está en esta matriz — llegó a su
        # fin de vida (sin parches de seguridad) el 31 de octubre de 2025.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Correr pruebas
        run: python -m pytest

      - name: Verificar que el paquete se puede importar tras instalación
        run: python -c "from orchestrator import MultiVerticalAgentSystem; print('OK')"
